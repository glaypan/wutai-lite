<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞台流程表 v6.3 手机客户端 · 设计预览</title>
<style>
:root {
  --bg-base:#0b0d10; --bg-elev:#15181d; --bg-elev-2:#1d2128;
  --stroke:rgba(255,255,255,0.09); --text-1:#f2f2f7; --text-2:#98989f; --text-3:#63636b;
  --primary:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:var(--bg-base); color:var(--text-1); max-width:420px; margin:0 auto; height:100vh; display:flex; flex-direction:column; position:relative; }
/* 顶栏 */
.topbar { padding:14px 18px 10px; display:flex; align-items:center; justify-content:space-between; }
.topbar .proj { font-size:15px; font-weight:800; }
.topbar .proj .role { font-size:10px; color:var(--primary); background:rgba(10,132,255,0.15); padding:2px 8px; border-radius:4px; margin-left:6px; font-weight:600; }
.topbar .conn { font-size:10px; color:var(--green); display:flex; align-items:center; gap:4px; }
.topbar .conn .dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
/* 正在进行的提示卡片（大） */
.now-section { padding:4px 18px 12px; }
.now-card { background:linear-gradient(135deg, rgba(10,132,255,0.18), rgba(10,132,255,0.05)); border:1px solid rgba(10,132,255,0.4); border-radius:16px; padding:20px; }
.now-card .label { font-size:11px; color:var(--primary); font-weight:800; letter-spacing:1px; margin-bottom:6px; }
.now-card .name { font-size:22px; font-weight:800; }
.now-card .timer { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--green); margin-top:6px; }
.now-card .meta { font-size:12px; color:var(--text-2); margin-top:8px; line-height:1.7; }
.next-strip { display:flex; align-items:center; gap:10px; margin-top:10px; background:var(--bg-elev); border:1px solid var(--stroke); border-radius:12px; padding:12px 14px; }
.next-strip .lbl { font-size:10px; color:var(--text-3); }
.next-strip .nm { font-size:14px; font-weight:700; flex:1; }
.next-strip .tally-tag { font-size:9px; color:var(--red); background:rgba(255,69,58,0.12); padding:2px 6px; border-radius:4px; }
/* 控制按钮区（执行台） */
.exec { display:flex; gap:10px; padding:0 18px 12px; }
.exec .btn { flex:1; padding:18px 0; border-radius:14px; border:none; font-size:16px; font-weight:800; cursor:pointer; }
.exec .prev { background:var(--bg-elev-2); color:var(--text-1); border:1px solid var(--stroke); }
.exec .go { background:var(--green); color:#062b12; font-size:19px; flex:1.4; }
.exec .next { background:var(--primary); color:#fff; }
/* 节目列表（收起/展开状态） */
.list-head { display:flex; align-items:center; justify-content:space-between; padding:8px 18px; }
.list-head .t { font-size:12px; color:var(--text-3); font-weight:600; }
.list-head .toggle { font-size:11px; color:var(--primary); background:rgba(10,132,255,0.12); padding:5px 12px; border-radius:16px; border:none; cursor:pointer; }
.list { flex:1; overflow-y:auto; padding:0 18px 90px; }
.item { display:flex; align-items:center; gap:10px; padding:13px 12px; border-bottom:1px solid var(--stroke); }
.item .idx { font-size:11px; color:var(--text-3); min-width:24px; }
.item .nm { flex:1; font-size:14px; font-weight:600; }
.item .tm { font-size:11px; color:var(--text-2); }
.item.active .nm { color:var(--primary); }
.item.completed { opacity:0.4; }
.item .st { width:7px; height:7px; border-radius:50%; }
.item .st.on { background:var(--primary); }
.item .st.done { background:var(--green); }
/* 底部导航 */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; display:flex; background:rgba(21,24,29,0.95); backdrop-filter:blur(20px); border-top:1px solid var(--stroke); z-index:20; padding-bottom:env(safe-area-inset-bottom); }
.bottom-nav button { flex:1; padding:12px 0 10px; background:none; border:none; color:var(--text-3); font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
.bottom-nav button.active { color:var(--primary); }
.bottom-nav .ico { font-size:18px; }
/* 悬浮列表按钮 */
.fab-list { position:fixed; right:16px; bottom:76px; width:52px; height:52px; border-radius:50%; background:var(--primary); border:none; color:#fff; font-size:20px; box-shadow:0 4px 16px rgba(10,132,255,0.4); z-index:15; cursor:pointer; }
.preview-badge { position:fixed; left:50%; transform:translateX(-50%); bottom:62px; background:rgba(255,159,10,0.9); color:#1a1200; font-size:10px; font-weight:700; padding:4px 12px; border-radius:16px; z-index:30; }
</style>
</head>
<body>

<div class="topbar">
  <div class="proj">张先生 & 李小姐婚礼 <span class="role">助理端</span></div>
  <div class="conn"><span class="dot"></span>已连接 14:32</div>
</div>

<div class="now-section">
  <div class="now-card">
    <div class="label">🎤 正在进行</div>
    <div class="name">新娘入场</div>
    <div class="timer">03:42</div>
    <div class="meta">背景音乐：婚礼进行曲 · 追光入场<br>备注：新娘父亲陪伴入场</div>
  </div>
  <div class="next-strip">
    <span class="lbl">⏭ 下一节目</span>
    <span class="nm">交换戒指</span>
    <span class="tally-tag">🔴 TALLY</span>
  </div>
</div>

<div class="exec">
  <button class="btn prev">◀</button>
  <button class="btn go">GO</button>
  <button class="btn next">▶</button>
</div>

<div class="list-head">
  <span class="t">节目流程（24）</span>
  <button class="toggle">📋 隐藏列表</button>
</div>

<div class="list">
  <div class="item completed"><span class="idx">01</span><span class="nm">开场视频</span><span class="tm">16:30</span><span class="st done"></span></div>
  <div class="item completed"><span class="idx">02</span><span class="nm">主持人开场</span><span class="tm">16:40</span><span class="st done"></span></div>
  <div class="item active"><span class="idx">03</span><span class="nm">新娘入场</span><span class="tm">17:00</span><span class="st on"></span></div>
  <div class="item"><span class="idx">04</span><span class="nm">交换戒指</span><span class="tm">17:10</span><span class="st" style="background:var(--text-3);opacity:0.3"></span></div>
  <div class="item"><span class="idx">05</span><span class="nm">新人致辞</span><span class="tm">17:20</span><span class="st" style="background:var(--text-3);opacity:0.3"></span></div>
  <div class="item"><span class="idx">06</span><span class="nm">切蛋糕</span><span class="tm">17:30</span><span class="st" style="background:var(--text-3);opacity:0.3"></span></div>
  <div class="item"><span class="idx">07</span><span class="nm">敬酒环节</span><span class="tm">18:00</span><span class="st" style="background:var(--text-3);opacity:0.3"></span></div>
  <div class="item"><span class="idx">08</span><span class="nm">互动游戏</span><span class="tm">18:20</span><span class="st" style="background:var(--text-3);opacity:0.3"></span></div>
</div>

<button class="fab-list">📋</button>

<nav class="bottom-nav">
  <button class="active"><span class="ico">🎬</span>节目</button>
  <button><span class="ico">⏱</span>计时</button>
  <button><span class="ico">🎯</span>Cue</button>
  <button><span class="ico">⚙️</span>设置</button>
</nav>

<div class="preview-badge">设计预览 · v6.3 手机执行台</div>
</body>
</html>
